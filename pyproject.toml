[project]
name = "pie-corpus"
version = "0.0.1"
description = "Reconstructed Proto-Indo-European training corpus: notation, lexicon, morphology engine, validator"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pymupdf>=2.0",
    "pytest>=8",
]
research = [
    "torch>=2.9",
]
# Kokoro-82M speech backend (pie/speak.py, docs/pronunciation.md "Speech"). kokoro and misaki require
# Python < 3.13, so this group resolves to nothing on the main 3.14 env; it is installed into a separate env:
#   UV_PROJECT_ENVIRONMENT=.venv-kokoro uv run --python 3.12 --group kokoro python -I scripts/speak.py ...
# Exact versions as tested in docs/research/tts-options.md (2026-10-28).
kokoro = [
    "kokoro==0.9.4; python_full_version < '3.13'",
    "misaki[en]==0.9.4; python_full_version < '3.13'",
    "torch==2.15.0; python_full_version < '3.13'",
    "transformers==5.21.0; python_full_version < '3.13'",
    "huggingface-hub==2.3.0; python_full_version < '3.13'",
    "numpy==2.5.4; python_full_version < '3.13'",
    "loguru==0.7.3; python_full_version < '3.13'",
]
translator = [
    "en-core-web-lg",
    "spacy>=3.8.18",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pie"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
en-core-web-lg = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_lg-3.8.0/en_core_web_lg-3.8.0-py3-none-any.whl" }
