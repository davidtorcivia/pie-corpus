# RL stage 6 (2026-11-03): translation both ways and dialogue on text no fine-tune has seen (the rl6-* batches,
# training/rl/make_rl6.py), with stage 5's kept prompts and drills as anchors; validation is unseen text only.
# From Nemotron e3, or from rl5's adapter when the benchmark prefers it (run_rl6.sh RL6_FROM); KL to e3 either way
# (the policy with its LoRA off). iters is set by run_rl6.sh to about one pass over the filtered train.jsonl.
model: /Users/david/AI/PIE-nemotron35-e3-oQ5e
train: true
train_mode: grpo
data: /Users/david/AI/pie-runs/rl/data/rl6
reward_functions_file: /Users/david/AI/PIE/training/rl/reward_rl.py
reward_functions: pie_rl
fuse: false
lora_parameters: {rank: 16, dropout: 0.0, scale: 10.0}
batch_size: 8
group_size: 8
max_completion_length: 384
max_seq_length: 1024
temperature: 1.0
learning_rate: 5.0e-6
lr_schedule: {name: cosine_decay, arguments: [5.0e-6, 100, 5.0e-7], warmup: 0}
beta: 0.2
iters: 100                    # replaced by run_rl6.sh: about one pass over the filtered train.jsonl
steps_per_report: 5
steps_per_eval: 50
val_batches: 29               # all 232 valid prompts (make_rl6.py VALID_PER_KIND), every kind scored
save_every: 25                 # 9.2 GB per checkpoint (LoRA on every expert)
seed: 20261104
grad_checkpoint: true
