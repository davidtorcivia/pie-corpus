# RL stage 5 (2026-11-03): on the model of record, Nemotron 3.5 Super e3 (benchmark v2 88.5 / 86.2), 5-bit oQ5e
# local quant (matches bf16 on the local sets). A fresh rank-16 LoRA with KL to e3 itself (the default reference: the
# base model). Mix rl3 (passrate.py): dialogue and PIE→EN are where the frontier models still lead (96.5 / 98.2 vs
# 87.1 / 88.7), with inflection and paradigm anchors. Guarded like stage 4 (grpo.py stop rules, beta 0.2, decaying
# lr, every skill in validation). Generation is pad-free (each prompt prefilled alone, its cache forked), which the
# Mamba layers need: checked 8/8 against one-at-a-time greedy (2026-11-03). Run by run_rl5.sh.
model: /Users/david/AI/PIE-nemotron35-e3-oQ5e
train: true
train_mode: grpo
data: /Users/david/AI/pie-runs/rl/data/rl5
reward_functions_file: /Users/david/AI/PIE/training/rl/reward_rl.py
reward_functions: pie_rl
fuse: false
lora_parameters: {rank: 16, dropout: 0.0, scale: 10.0}
batch_size: 8
group_size: 8
max_completion_length: 384
max_seq_length: 1024
temperature: 1.0
learning_rate: 5.0e-6
lr_schedule: {name: cosine_decay, arguments: [5.0e-6, 100, 5.0e-7], warmup: 0}
beta: 0.2
iters: 100                    # ~one pass over the 743 kept prompts (Nemotron e3 reproduces most of the rest exactly)
steps_per_report: 5
steps_per_eval: 50
val_batches: 23               # all 180 valid prompts, so every kind is scored
save_every: 25                 # 9.2 GB per checkpoint (LoRA on every expert)
seed: 20261103
grad_checkpoint: true
