<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PIE RL</title>
<style>
/* One question per block, top to bottom: where is the run, is it healthy, is each skill getting better, then the
   mechanics. Colors: one accent for the run's own lines, status colors only for verdicts. */
:root{--bg:#f5f6f8;--card:#fff;--fg:#11151c;--fg2:#4b5361;--fg3:#7a8290;--line:#e3e6eb;--line2:#c5cbd4;
 --accent:#2a78d6;--soft:#9cc2f0;--good:#1f8a4c;--warn:#b77900;--bad:#c8382f;--goodbg:#e5f4ea;--warnbg:#fbf1dc;--badbg:#fbe6e4}
@media (prefers-color-scheme:dark){:root{--bg:#0f1217;--card:#161a21;--fg:#eef1f5;--fg2:#aab2bf;--fg3:#7e8796;--line:#252a33;--line2:#3a414d;
 --accent:#4a90e8;--soft:#2c5687;--good:#3fb46c;--warn:#e0a53a;--bad:#ec6a5f;--goodbg:#14301f;--warnbg:#36290f;--badbg:#3a1a17;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 ui-sans-serif,-apple-system,"Segoe UI",system-ui,sans-serif}
main{max-width:1180px;margin:0 auto;padding:20px max(16px,env(safe-area-inset-left)) 60px}
a{color:var(--accent)}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:14px}
h1{font-size:20px;margin:0;font-weight:650}
.meta{color:var(--fg3);font-size:13px}
.runs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.runs button{font:inherit;font-size:13px;border:1px solid var(--line2);background:var(--card);color:var(--fg2);border-radius:999px;padding:5px 12px;cursor:pointer}
.runs button[aria-pressed=true]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px 20px;margin-bottom:14px;min-width:0}
h2{font-size:16px;margin:0 0 4px;font-weight:650}
.why{color:var(--fg3);font-size:13px;margin:0 0 14px;max-width:80ch}
.status{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,2fr);gap:24px}
@media(max-width:820px){.status{grid-template-columns:minmax(0,1fr)}}
.phase{font-size:28px;font-weight:700;letter-spacing:-.01em;line-height:1.15}
.phase small{display:block;font-size:14px;font-weight:400;color:var(--fg2);letter-spacing:0;margin-top:6px}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin:14px 0 8px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:4px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px 18px;margin-top:12px}
.fact b{display:block;font-size:20px;font-weight:650;font-variant-numeric:tabular-nums}
.fact span{font-size:12px;color:var(--fg3)}
.checks{display:grid;gap:10px;align-content:start}
.check{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;padding:12px 14px;border-radius:8px;background:var(--bg)}
.check .pill{grid-row:span 2;align-self:start;font-size:12px;font-weight:650;padding:3px 9px;border-radius:999px;white-space:nowrap}
.check b{font-weight:600}
.check p{margin:0;color:var(--fg2);font-size:13px}
.ok .pill{background:var(--goodbg);color:var(--good)}.watch .pill{background:var(--warnbg);color:var(--warn)}.bad .pill{background:var(--badbg);color:var(--bad)}.wait .pill{background:var(--line);color:var(--fg3)}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left;padding-left:0}
th{font-size:12px;font-weight:600;color:var(--fg3)}
td.d{font-weight:650}.up{color:var(--good)}.down{color:var(--bad)}.flat{color:var(--fg3)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px 22px}
.panel h3{font-size:13px;font-weight:600;margin:0 0 2px;display:flex;justify-content:space-between;gap:8px}
.panel h3 span{font-weight:500;color:var(--fg3);font-variant-numeric:tabular-nums}
svg{display:block;width:100%;height:auto;overflow:visible}
svg text{fill:var(--fg3);font-size:10px;font-family:ui-monospace,Menlo,monospace}
.gl{stroke:var(--line);stroke-width:1}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--fg2);margin:-6px 0 12px}
.legend i{display:inline-block;width:14px;height:0;border-top:2px solid;vertical-align:middle;margin-right:6px}
.legend i.dot{width:8px;height:8px;border:0;border-radius:50%;background:var(--accent)}
details summary{cursor:pointer;color:var(--fg2);font-size:14px}
pre{font-size:12px;color:var(--fg2);white-space:pre-wrap;margin:10px 0 0}
.empty{color:var(--fg3);font-size:14px;padding:6px 0}
.tip{position:fixed;z-index:9;pointer-events:none;background:var(--card);border:1px solid var(--line2);border-radius:6px;padding:6px 9px;font-size:12px;box-shadow:0 4px 16px rgb(0 0 0/.12);white-space:nowrap}
</style>
</head>
<body>
<main>
<div class="top"><h1>PIE reinforcement learning</h1><span class="meta">Mac M3 Ultra · synced every 5 min · <a href="/">fine-tuning</a> · <a href="/tts">tts</a> · <span id="when"></span></span></div>
<div class="runs" id="runs"></div>
<div id="app"></div>
</main>
<div class="tip" id="tip" hidden></div>
<script>
const KIND={inflect:"Inflection",paradigm:"Paradigms",translate_en_pie:"English → PIE",translate_pie_en:"PIE → English",
 dialogue:"Dialogue",vocab_en_pie:"Vocabulary EN → PIE",vocab_pie_en:"Vocabulary PIE → EN"};
const ORDER=Object.keys(KIND);
const esc=s=>(s??"").toString().replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const f=(v,d=2)=>v==null||isNaN(v)?"–":(+v).toFixed(d);
const pct=v=>v==null?"–":Math.round(100*v)+"%";
const dur=s=>s==null||!isFinite(s)?"–":s<90?Math.round(s)+" s":s<5400?Math.round(s/60)+" min":(s/3600).toFixed(1)+" h";
const clock=t=>new Date(t).toLocaleString([], {weekday:"short",hour:"numeric",minute:"2-digit"});
const median=a=>{const b=[...a].sort((x,y)=>x-y);return b.length?b[Math.floor(b.length/2)]:null};
let runs=[],sel=new URLSearchParams(location.search).get("run");

// a small line chart: series [{pts:[[x,y]],stroke,width,dots}], fixed y domain, optional horizontal rules
function spark(series,{W=280,H=120,y0=0,y1=1,x1=null,rules=[],yfmt=v=>v}={}){
 const xs=series.flatMap(s=>s.pts.map(p=>p[0])); const xmax=x1??Math.max(1,...xs), L=30,R=6,T=6,B=18;
 const X=x=>L+(W-L-R)*x/xmax, Y=y=>T+(H-T-B)*(1-(Math.min(y1,Math.max(y0,y))-y0)/(y1-y0));
 let s=[y0,(y0+y1)/2,y1].map(t=>`<line class="gl" x1="${L}" x2="${W-R}" y1="${Y(t)}" y2="${Y(t)}"/><text x="${L-4}" y="${Y(t)}" dy=".35em" text-anchor="end">${yfmt(t)}</text>`).join("");
 s+=`<text x="${L}" y="${H-4}">0</text><text x="${W-R}" y="${H-4}" text-anchor="end">${xmax}</text>`;
 rules.forEach(r=>s+=`<line x1="${L}" x2="${W-R}" y1="${Y(r.y)}" y2="${Y(r.y)}" stroke="${r.c}" stroke-width="1.5" stroke-dasharray="5 4"/><text x="${W-R}" y="${Y(r.y)-4}" text-anchor="end" style="fill:${r.c}">${r.label}</text>`);
 series.forEach(se=>{ if(!se.pts.length)return;
  if(se.pts.length>1)s+=`<polyline fill="none" stroke="${se.stroke}" stroke-width="${se.width||1.5}" stroke-linejoin="round" points="${se.pts.map(p=>X(p[0])+","+Y(p[1])).join(" ")}"/>`;
  if(se.dots)se.pts.forEach(p=>s+=`<circle cx="${X(p[0])}" cy="${Y(p[1])}" r="4" fill="${se.stroke}" stroke="var(--card)" stroke-width="2" data-tip="${esc(se.name+" · step "+p[0]+": "+yfmt(p[1]))}"/>`)});
 return `<svg viewBox="0 0 ${W} ${H}">${s}</svg>`}

function analyse(r){
 const tr=r.metrics.filter(m=>m.event==="train"), va=r.metrics.filter(m=>m.event==="val");
 const start=r.metrics.find(m=>m.event==="start")||{}, done=r.metrics.find(m=>m.event==="done");
 const total=+((r.config.match(/^iters:\s*(\d+)/m)||[])[1]||0), every=+((r.config.match(/^steps_per_eval:\s*(\d+)/m)||[])[1]||0);
 const steps=tr.slice(1).map((m,i)=>(m.t-tr[i].t)/(m.iteration-tr[i].iteration)).filter(x=>x>0);
 const stepS=median(steps.slice(-10)), valS=median(va.map(v=>v.val_time).filter(Boolean));
 const last=tr[tr.length-1]||{}, step=last.iteration||0;
 // validation by top-level kind; each round's step from the metrics log
 const vrounds=(r.val_strata||[]).map(w=>({step:w.step,k:Object.fromEntries(Object.entries(w).filter(([k])=>k!=="step"&&!k.includes(":")))}));
 const trainK={}; (r.rewards||[]).forEach(w=>Object.entries(w).forEach(([k,v])=>{ if(k.startsWith("reward/")&&!k.includes(":")){(trainK[k.slice(7)]??=[]).push([w.step,v])}}));
 let phase=r.pipeline?.phase||(tr.length?"training":"starting");
 if(done) phase=r.pipeline&&r.pipeline.phase!=="done"?"evaluating":"done";
 if(done&&!r.pipeline) phase=r.evals.some(e=>e.ckpt!=="base")?"done":"evaluating";
 const valLeft=every?Math.max(0,Math.floor(total/every)-Math.floor(step/every)):0;
 const eta=stepS&&!done?(total-step)*stepS+valLeft*(valS||0):null;
 const kl=tr.slice(-3).map(m=>m.train_kl).filter(v=>v!=null), klNow=kl.length?kl.reduce((a,b)=>a+b)/kl.length:null;
 return {tr,va,start,done,total,every,stepS,valS,step,vrounds,trainK,phase,eta,klNow,klStop:start.kl_stop||0.3,last}}

function checks(a){
 const out=[];
 // drift
 if(a.klNow==null) out.push(["wait","Drift from the starting model","No training steps yet."]);
 else {const s=a.klStop, v=a.klNow, cls=v>s?"bad":v>s/2?"watch":"ok";
  out.push([cls,"Drift from the starting model",`KL ${f(v,3)} (mean of the last 3 reports). The run stops itself after 2 reports above ${s}. ${cls==="ok"?"Well inside.":cls==="watch"?"Past halfway to the stop line.":"Above the stop line."}`])}
 // skills
 const R=a.vrounds; if(R.length<2) out.push(["wait","Skills on held-out prompts",R.length?"Baseline measured at step "+R[0].step+"."+(a.every?" The next check is at step "+a.every+".":""):"Measured at step 1"+(a.every?", then every "+a.every+" steps.":", then at each validation.")]);
 else {const b=R[0].k,l=R[R.length-1].k, d=ORDER.filter(k=>b[k]!=null&&l[k]!=null).map(k=>[k,l[k]-b[k]]);
  const down=d.filter(x=>x[1]<-0.03), up=d.filter(x=>x[1]>0.03);
  out.push([down.some(x=>x[1]<-0.08)?"bad":down.length?"watch":"ok","Skills on held-out prompts",
   `Since step ${R[0].step}: ${up.length} up, ${down.length} down, ${d.length-up.length-down.length} level (±0.03).`+(down.length?" Down: "+down.map(x=>KIND[x[0]]+" "+f(x[1],2)).join(", ")+".":"")])}
 // learning signal
 const sig=a.tr.slice(-3).map(m=>m.train_grouped_rewards_std).filter(v=>v!=null);
 if(!sig.length) out.push(["wait","Learning signal","No training steps yet."]);
 else {const v=sig.reduce((x,y)=>x+y)/sig.length; out.push([v<0.05?"watch":"ok","Learning signal",`Rollouts of the same prompt differ by σ ${f(v,3)} on average. ${v<0.05?"Most groups score alike, so most steps teach little.":"Groups disagree, so steps have something to learn from."}`])}
 const hit=a.last.train_hit_max_tokens_ratio; if(hit!=null&&hit>0.05) out.push(["watch","Answers hitting the length cap",`${pct(hit)} of rollouts ran to the token cap: a looping or padding sign.`]);
 return out}

function render(){
 const r=runs.find(x=>x.name===sel); if(!r){document.getElementById("app").innerHTML='<div class="card empty">No RL runs synced yet.</div>';return}
 const a=analyse(r), P=r.pipeline;
 let head="",bar=0,facts=[];
 if(a.phase==="filtering"&&P?.filter){const p=P.filter; bar=p.done/p.total;
  head=`Choosing training prompts<small>Sampling the model 4 times on each candidate and keeping the ones it sometimes gets wrong. Training starts when this ends.</small>`;
  facts=[["Candidates",p.done+" / "+p.total],["Time so far",dur(p.elapsed_s)],["Filter ends",p.eta_min!=null?"~"+clock(Date.now()+p.eta_min*6e4):"–"]]}
 else if(a.phase==="training"||a.phase==="starting"){bar=a.total?a.step/a.total:0;
  head=`${a.tr.length?"Training":"Starting"} · step ${a.step} of ${a.total}<small>${a.every?"Validation every "+a.every+" steps; ":""}checkpoints saved every ${(r.config.match(/^save_every:\s*(\d+)/m)||[])[1]||"?"} steps.</small>`;
  facts=[["Step time",dur(a.stepS)],["Validation pass",dur(a.valS)],["Training ends",a.eta?"~"+clock(Date.now()+a.eta*1e3):"–"],["Judge spend","$"+f((r.rewards.at(-1)||{}).judge_usd,2)],["Peak memory",a.last.peak_memory?f(a.last.peak_memory,0)+" GB":"–"]]}
 else {bar=1; const stopped=a.done?.stopped;
  head=(a.phase==="evaluating"?"Evaluating checkpoints":stopped?"Stopped early":"Finished")+`<small>${stopped?esc(stopped)+" at step "+a.step+". The last saved checkpoint is the one to use.":a.phase==="evaluating"?"Training ended at step "+a.step+"; scoring frozen prompt sets with the base and each checkpoint.":"Trained "+a.step+" steps."}</small>`;
  facts=[["Steps",a.step+" / "+a.total],["Judge spend","$"+f((r.rewards.at(-1)||{}).judge_usd,2)]]}
 let html=`<div class="card status"><div><div class="phase">${head}</div><div class="bar"><i style="width:${Math.round(100*bar)}%"></i></div>
  <div class="facts">${facts.map(([k,v])=>`<div class="fact"><b>${v}</b><span>${k}</span></div>`).join("")}</div></div>
  <div class="checks">${checks(a).map(([c,t,p])=>`<div class="check ${c}"><span class="pill">${{ok:"OK",watch:"Watch",bad:"Problem",wait:"Waiting"}[c]}</span><b>${t}</b><p>${p}</p></div>`).join("")}</div></div>`;

 // filter results
 if(r.data?.by_kind){html+=`<div class="card"><h2>Training prompts chosen</h2><p class="why">Prompts the model always got right were dropped: they give no learning signal.</p><div class="tw"><table><thead><tr><th>Kind</th><th>Sampled</th><th>Always right</th><th>Never right</th><th>Kept</th></tr></thead><tbody>`+
  ORDER.filter(k=>r.data.by_kind[k]).map(k=>{const s=r.data.by_kind[k];return `<tr><td>${KIND[k]}</td><td>${s.sampled}</td><td>${s.always} <span class="flat">(${pct(s.always/s.sampled)})</span></td><td>${s.never}</td><td><b>${s.kept}</b></td></tr>`}).join("")+`</tbody></table></div></div>`}

 // skills table
 const R=a.vrounds;
 html+=`<div class="card"><h2>Is each skill getting better?</h2><p class="why">Mean reward on the same held-out validation prompts at each check (0–1). These prompts are never trained on, so this is the number to trust; training rewards below swing with each batch.</p>`;
 if(!R.length) html+=`<div class="empty">First validation runs at step 1, before any update.</div>`;
 else {const ks=ORDER.filter(k=>R.some(w=>w.k[k]!=null));
  html+=`<div class="tw"><table><thead><tr><th>Skill</th>${R.map(w=>`<th>step ${w.step}</th>`).join("")}<th>change</th></tr></thead><tbody>`+
  ks.map(k=>{const b=R[0].k[k],l=R[R.length-1].k[k],d=R.length>1&&b!=null&&l!=null?l-b:null;
   return `<tr><td>${KIND[k]}</td>${R.map(w=>`<td>${f(w.k[k])}</td>`).join("")}<td class="d ${d==null?"flat":d>0.03?"up":d<-0.03?"down":"flat"}">${d==null?"–":(d>0?"+":"")+f(d)}</td></tr>`}).join("")+`</tbody></table></div>`}
 html+=`</div>`;

 // per-skill panels
 const ks=ORDER.filter(k=>a.trainK[k]||R.some(w=>w.k[k]!=null));
 if(ks.length){html+=`<div class="card"><h2>Reward by skill over training</h2><p class="why">The line is the training reward (5-step mean, noisy); the dots are validation. A falling dot series is a regression.</p>
  <div class="legend"><span><i style="border-color:var(--soft)"></i>training reward</span><span><i class="dot"></i>validation</span></div><div class="grid">`+
  ks.map(k=>{const v=R.filter(w=>w.k[k]!=null).map(w=>[w.step,w.k[k]]), t=a.trainK[k]||[];
   return `<div class="panel"><h3>${KIND[k]}<span>${v.length?"val "+f(v.at(-1)[1]):""}</span></h3>${spark([{name:"training",pts:t,stroke:"var(--soft)"},{name:KIND[k]+" validation",pts:v,stroke:"var(--accent)",width:2,dots:true}],{x1:a.total||null})}</div>`}).join("")+`</div></div>`}

 // frozen evals
 if(r.evals.length){const sets=[...new Set(r.evals.map(e=>e.set))], M=[["chrF","chrF",1,1],["exact","inflection exact",0,100],["paradigm_cells","paradigm cells",0,100],["recognized","words recognized",0,100],["modern","modern-word slips",0,100]];
  html+=`<div class="card"><h2>Frozen prompt sets, base vs checkpoints</h2><p class="why">Greedy answers to fixed prompts the run never sees, scored locally. Change is against the base model.</p>`+
  sets.map(st=>{const E=r.evals.filter(e=>e.set===st), base=E.find(e=>e.ckpt==="base");
   return `<h3 style="font-size:13px;margin:12px 0 4px">${esc(st)}</h3><div class="tw"><table><thead><tr><th>Metric</th>${E.map(e=>`<th>${esc(e.ckpt)}</th>`).join("")}</tr></thead><tbody>`+
   M.filter(([k])=>E.some(e=>e[k]!=null)).map(([k,l,dp,sc])=>`<tr><td>${l}</td>${E.map(e=>{const v=e[k]; if(v==null)return "<td>–</td>"; const d=base&&e!==base&&base[k]!=null?(v-base[k])*sc:null, good=k==="modern"?-d:d;
     return `<td>${(v*sc).toFixed(dp)}${d==null?"":` <span class="${Math.abs(d)<0.5?"flat":good>0?"up":"down"}">${d>0?"+":""}${d.toFixed(1)}</span>`}</td>`}).join("")}</tr>`).join("")+`</tbody></table></div>`}).join("")+`</div>`}

 // mechanics
 if(a.tr.length){const T=a.tr, x=m=>m.iteration;
  html+=`<div class="card"><h2>Mechanics</h2><p class="why">Drift, learning signal, answer length and speed.</p><div class="grid">`+
  `<div class="panel"><h3>KL to the starting model<span>${f(a.klNow,3)}</span></h3>${spark([{pts:T.map(m=>[x(m),m.train_kl]),stroke:"var(--accent)",width:2}],{x1:a.total,y1:Math.max(a.klStop*1.2,...T.map(m=>m.train_kl||0)),rules:[{y:a.klStop,c:"var(--bad)",label:"stop "+a.klStop}],yfmt:v=>v.toFixed(2)})}</div>`+
  `<div class="panel"><h3>Group σ (learning signal)<span>${f(a.last.train_grouped_rewards_std,3)}</span></h3>${spark([{pts:T.map(m=>[x(m),m.train_grouped_rewards_std]),stroke:"var(--accent)",width:2}],{x1:a.total,y1:Math.max(0.3,...T.map(m=>m.train_grouped_rewards_std||0)),yfmt:v=>v.toFixed(2)})}</div>`+
  `<div class="panel"><h3>Tokens per answer<span>${f(a.last.train_average_generated_tokens,0)}</span></h3>${spark([{pts:T.map(m=>[x(m),m.train_average_generated_tokens]),stroke:"var(--accent)",width:2}],{x1:a.total,y1:Math.max(100,...T.map(m=>m.train_average_generated_tokens||0)),yfmt:v=>Math.round(v)})}</div>`+
  `<div class="panel"><h3>Seconds per step<span>${f(a.stepS,0)}</span></h3>${spark([{pts:T.slice(1).map((m,i)=>[x(m),(m.t-T[i].t)/(m.iteration-T[i].iteration)]),stroke:"var(--accent)",width:2}],{x1:a.total,y1:Math.max(60,...T.slice(1).map((m,i)=>(m.t-T[i].t)/(m.iteration-T[i].iteration))),yfmt:v=>Math.round(v)})}</div>`+
  `</div></div>`}
 html+=`<div class="card"><details><summary>Config${a.start.reference?" · reference: "+esc(a.start.reference):""}</summary><pre>${esc(r.config||"(not synced yet)")}</pre>${P?.tail?.length?`<pre>${esc(P.tail.join("\n"))}</pre>`:""}</details></div>`;
 document.getElementById("app").innerHTML=html}

async function refresh(){
 try{runs=await (await fetch("/api/rl")).json()}catch(e){return}
 if(!sel||!runs.some(r=>r.name===sel)) sel=runs[0]?.name;
 document.getElementById("runs").innerHTML=runs.map(r=>`<button aria-pressed="${r.name===sel}" data-run="${esc(r.name)}">${esc(r.name)}</button>`).join("");
 render(); document.getElementById("when").textContent="updated "+new Date().toLocaleTimeString()}
document.getElementById("runs").onclick=e=>{const b=e.target.closest("button[data-run]"); if(b){sel=b.dataset.run; refresh()}};
const tip=document.getElementById("tip");
document.addEventListener("pointermove",e=>{const t=e.target.closest("[data-tip]"); if(!t){tip.hidden=true;return}
 tip.textContent=t.getAttribute("data-tip"); tip.hidden=false; tip.style.left=Math.min(e.clientX+12,innerWidth-tip.offsetWidth-8)+"px"; tip.style.top=(e.clientY+12)+"px"});
refresh(); setInterval(refresh,30000);
</script>
</body>
</html>
